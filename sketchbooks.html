<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio of Arathy Aluckal — social designer, researcher and visual storyteller." />
  <title>Sketchbooks! — Arathy Aluckal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f5f3ee;--ink:#121212;--muted:#686761;--line:rgba(18,18,18,.18);--accent:#d84b2a}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,Arial,sans-serif}
    a{color:inherit;text-decoration:none}.mono{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
    nav{position:fixed;z-index:20;top:0;left:0;width:100%;padding:20px 4vw;display:flex;justify-content:space-between;align-items:center;color:#111;background:linear-gradient(to bottom,rgba(245,243,238,.9),rgba(245,243,238,0));backdrop-filter:blur(3px)}
    .brand{font-weight:800;font-size:15px}.navlinks{display:flex;gap:24px}.navlinks a{font-size:12px}.navlinks a:hover{color:var(--accent)}
    .hero{min-height:100svh;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:0 4vw 6vh;background:#e9e8e4}
    .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:contrast(1.08)}
    .hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(245,243,238,.08) 38%,rgba(245,243,238,.96) 100%)}
    .hero-content{position:relative;z-index:2;max-width:1100px}.eyebrow{display:flex;gap:14px;align-items:center;margin-bottom:18px}.dot{width:8px;height:8px;background:var(--accent);border-radius:50%}
    h1{font-size:clamp(58px,10vw,160px);line-height:.86;letter-spacing:-.07em;margin:0;font-weight:800;max-width:1000px}.hero p{font-family:'Playfair Display',serif;font-size:clamp(20px,2.3vw,34px);line-height:1.2;max-width:720px;margin:28px 0 0}
    .scroll{position:absolute;right:4vw;bottom:6vh;z-index:3;writing-mode:vertical-rl;display:flex;gap:10px;align-items:center;color:var(--muted)}
    section{padding:110px 4vw;border-top:1px solid var(--line)}.grid{display:grid;grid-template-columns:1fr 2fr;gap:7vw}.label{font-family:'DM Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
    h2{font-size:clamp(42px,6vw,86px);line-height:.95;letter-spacing:-.055em;margin:0 0 32px}.intro{font-size:clamp(21px,2.3vw,34px);line-height:1.35;max-width:900px}.body{font-size:16px;line-height:1.7;color:#383735;max-width:700px}
    .projects{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;margin-top:70px}.project{grid-column:span 6;border:1px solid var(--line);padding:28px;min-height:340px;display:flex;flex-direction:column;justify-content:space-between;background:#f8f7f3;transition:.25s transform,.25s background}.project:hover{transform:translateY(-6px);background:#fff}
    .project:nth-child(2){grid-column:span 6;background:#1b1b1a;color:#f4f2ed}.project:nth-child(3){grid-column:span 7}.project:nth-child(4){grid-column:span 5;background:#ddd8ce}.project .num{font-family:'DM Mono',monospace;font-size:12px}.project h3{font-size:clamp(28px,3.5vw,52px);line-height:1;letter-spacing:-.05em;margin:20px 0}.project p{max-width:460px;line-height:1.5}.tags{display:flex;gap:8px;flex-wrap:wrap}.tag{border:1px solid currentColor;border-radius:99px;padding:7px 10px;font-size:11px;font-family:'DM Mono',monospace}
    .method-list{border-top:1px solid var(--line)}.method{display:grid;grid-template-columns:90px 1fr 1fr;gap:25px;padding:25px 0;border-bottom:1px solid var(--line)}.method h3{margin:0;font-size:22px}.method p{margin:0;color:var(--muted);line-height:1.6}
    .statement{background:var(--ink);color:var(--paper)}.statement h2{max-width:1050px;font-family:'Playfair Display',serif;font-style:italic;font-weight:600;letter-spacing:-.045em}.statement .label{color:#aaa59d}
    footer{padding:90px 4vw 40px;background:var(--accent);color:#1b120e}.contact{font-size:clamp(42px,7vw,105px);line-height:.95;letter-spacing:-.06em;font-weight:800;max-width:1050px}.contact a{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:8px}.footer-bottom{margin-top:80px;padding-top:18px;border-top:1px solid rgba(0,0,0,.35);display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:11px}
    @media(max-width:700px){nav{padding:16px 5vw}.navlinks{gap:12px}.navlinks a:nth-child(2){display:none}.hero{padding:0 5vw 8vh}.scroll{display:none}section{padding:75px 5vw}.grid{grid-template-columns:1fr;gap:28px}.projects{display:block;margin-top:45px}.project{margin-bottom:14px;min-height:300px}.method{grid-template-columns:48px 1fr}.method p{grid-column:2}.footer-bottom{display:block}.footer-bottom span{display:block;margin:8px 0}}

    /* Expandable portfolio navigation */
    .portfolio-sidebar{position:fixed;top:64px;bottom:0;left:0;width:280px;z-index:15;overflow-y:auto;padding:36px 22px;background:var(--paper);border-right:1px solid var(--line)}
    main,body>footer{margin-left:280px}
    .sidebar-heading{font-family:'DM Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:0 0 24px;cursor:pointer}
    .sidebar-group{border-top:1px solid var(--line)}
    .sidebar-group>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:19px 0;font-size:14px;font-weight:700;cursor:pointer}
    .sidebar-group>summary::-webkit-details-marker{display:none}
    .sidebar-group>summary::after{content:'+';margin-left:auto;font-size:20px;font-weight:400;color:var(--accent)}
    .sidebar-group[open]>summary::after{content:'−'}
    .sidebar-number{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);font-weight:400}
    .sidebar-items{padding:0 0 18px 26px;font-size:13px;line-height:1.5}
    .sidebar-items a{display:block;padding:7px 0}
    .sidebar-items a:hover{color:var(--accent)}
    .sidebar-items p{margin:0;color:var(--muted)}
    :focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    article[id],section[id],footer[id]{scroll-margin-top:90px}
    h1{font-size:clamp(54px,8vw,130px)}
    @media(max-width:1000px){
      .portfolio-sidebar{position:relative;top:auto;bottom:auto;width:100%;margin-top:64px;padding:18px 5vw;border-right:0;border-bottom:1px solid var(--line)}
      main,body>footer{margin-left:0}
      .sidebar-heading{padding:0}
      .sidebar-sections{padding-top:18px}
      .hero{min-height:85svh}
    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.project{transition:none}}

  
.category-link{display:flex;align-items:center;gap:10px;padding:20px 0;border-top:1px solid var(--line);font-size:14px;font-weight:700}.category-arrow{margin-left:auto;color:var(--accent)}.category-link:hover,.category-link[aria-current=page]{color:var(--accent)}.collection{min-height:85svh;padding-top:125px}.collection h1{font-size:clamp(42px,6vw,86px);line-height:1.05;letter-spacing:-.055em;margin:20px 0}.collection-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:48px}.collection-grid .project{grid-column:auto!important;min-height:360px;margin:0}.collection-grid .project h3{font-size:clamp(28px,3vw,44px)}.empty-collection{grid-column:1/-1;border:1px dashed var(--line);padding:64px 28px;color:var(--muted)}@media(max-width:700px){.collection{padding-top:50px}.collection-grid{grid-template-columns:1fr}.category-link{padding:14px 0}}

    /* Overlay navigation leaves the artwork full bleed. */
    main,body>footer{margin-left:0}
    .portfolio-sidebar{position:fixed;top:0;bottom:0;left:0;width:280px;margin:0;padding:88px 22px 28px;z-index:40;transform:translateX(-100%);transition:transform .25s ease;box-shadow:8px 0 30px rgba(0,0,0,.08)}
    .sidebar-trigger{position:fixed;left:12px;top:78px;z-index:45;border:1px solid var(--line);border-radius:50%;width:42px;height:42px;background:var(--paper);color:var(--ink);font-size:21px;cursor:pointer}
    .sidebar-edge{position:fixed;left:0;top:0;bottom:0;width:14px;z-index:39}
    .sidebar-shell:focus-within .portfolio-sidebar,.sidebar-shell.is-open .portfolio-sidebar{transform:translateX(0)}
    @media(hover:hover){.sidebar-shell:hover .portfolio-sidebar{transform:translateX(0)}}
    .hero{min-height:100svh}
    @media(max-width:1000px){.portfolio-sidebar{position:fixed;top:0;bottom:0;margin:0;width:min(280px,85vw);padding:88px 22px 28px}.sidebar-heading{padding-bottom:24px}.sidebar-sections{padding-top:0}}
    @media(prefers-reduced-motion:reduce){.portfolio-sidebar{transition:none}}
</style>
</head>

  <main id="top"><section class="collection"><a class="mono" href="index.html">← Back to home</a><h1>Sketchbooks!</h1><p class="body">Selected projects and explorations.</p><div class="collection-grid"><div class="empty-collection">New work will appear here soon.</div></div></section></main>

<script>
const shell=document.querySelector('.sidebar-shell');
const trigger=document.querySelector('.sidebar-trigger');
const panel=document.querySelector('.portfolio-sidebar');
function syncMenu(){const open=shell.classList.contains('is-open')||shell.matches(':focus-within')||(matchMedia('(hover:hover)').matches&&shell.matches(':hover'));trigger.setAttribute('aria-expanded',String(open));}
trigger.addEventListener('click',()=>{if(shell.classList.contains('is-open')){shell.classList.remove('is-open');trigger.blur();}else{shell.classList.add('is-open');}syncMenu();});
shell.addEventListener('mouseenter',syncMenu);shell.addEventListener('mouseleave',syncMenu);
shell.addEventListener('focusin',syncMenu);shell.addEventListener('focusout',()=>setTimeout(syncMenu,0));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){shell.classList.remove('is-open');if(shell.contains(document.activeElement))document.activeElement.blur();syncMenu();}});
document.addEventListener('click',e=>{if(!shell.contains(e.target)){shell.classList.remove('is-open');syncMenu();}});
</script>
</body>
